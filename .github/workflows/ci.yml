# CI de raiz-relayer: typecheck + tests unitarios + build de la imagen Docker.
# No usa secretos: los tests unitarios corren con RPC falso y la integración
# contra testnet (RELAYER_IT=1) queda fuera de CI a propósito.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo comprobamos que la imagen compila; no se publica en ningún registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: raiz-relayer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
